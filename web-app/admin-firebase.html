<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Management - ระบบจัดการผู้ดูแลระบบ (Firebase)</title>
    <script src="navbar.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f0f0f0;
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }

        .page-wrapper {
            padding: 20px;
            margin-top: 80px;
            min-height: calc(100vh - 80px);
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: #f5f3e8;
            border-radius: 25px;
            padding: 30px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
            border: 3px solid #333;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 36px;
            color: #333;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .header p {
            color: #666;
            font-size: 18px;
        }

        .firebase-notice {
            background: #d1ecf1;
            border: 2px solid #bee5eb;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
            text-align: center;
        }

        .firebase-notice h3 {
            color: #0c5460;
            margin-bottom: 5px;
        }

        .firebase-notice p {
            color: #0c5460;
            font-size: 16px; /* เพิ่มจาก 14px เป็น 16px */
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
            font-size: 18px;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .dashboard-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            border: 2px solid #4A90E2;
            text-align: center;
        }

        .dashboard-card h3 {
            color: #4A90E2;
            margin-bottom: 15px;
            font-size: 20px;
        }

        .dashboard-number {
            font-size: 48px;
            font-weight: bold;
            color: #333;
            margin-bottom: 10px;
        }

        .dashboard-label {
            color: #666;
            font-size: 16px; /* เพิ่มจาก 14px เป็น 16px */
        }

        .tabs-container {
            background: white;
            border-radius: 15px;
            border: 2px solid #4A90E2;
            overflow: hidden;
        }

        .tabs-header {
            display: flex;
            background: #4A90E2;
        }

        .tab-button {
            flex: 1;
            padding: 15px 20px;
            background: transparent;
            border: none;
            color: white;
            font-weight: bold;
            cursor: pointer;
            font-size: 18px; /* เพิ่มจาก 16px เป็น 18px */
        }

        .tab-button.active {
            background: white;
            color: #4A90E2;
        }

        .tab-button:hover:not(.active) {
            background: rgba(255,255,255,0.1);
        }

        .tab-content {
            padding: 25px;
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* Sub-tabs styles */
        .sub-tabs {
            margin: 20px 0;
        }

        .sub-tab-btn {
            transition: all 0.3s ease;
        }

        .sub-tab-btn:hover {
            opacity: 0.9;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.15);
        }

        .sub-tab-btn.active {
            box-shadow: 0 4px 12px rgba(74, 123, 167, 0.3);
        }

        .table-container {
            overflow-x: auto;
            margin-top: 20px;
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        .data-table th,
        .data-table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        .data-table th {
            background: #f8f9fa;
            font-weight: bold;
            color: #333;
            position: sticky;
            top: 0;
        }

        .data-table tbody tr:hover {
            background: #f8f9fa;
        }

        .status-badge {
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
        }

        .status-pending {
            background: #fff3cd;
            color: #856404;
        }

        .status-approved {
            background: #d4edda;
            color: #155724;
        }

        .status-completed {
            background: #cce5ff;
            color: #004085;
        }

        .status-rejected {
            background: #f8d7da;
            color: #721c24;
        }

        .action-buttons {
            display: flex;
            gap: 5px;
        }

        .btn {
            padding: 6px 12px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
            text-decoration: none;
            display: inline-block;
        }

        .btn-approve {
            background: #28a745;
            color: white;
        }

        .btn-reject {
            background: #dc3545;
            color: white;
        }

        .btn-complete {
            background: #007bff;
            color: white;
        }

        .btn-view {
            background: #6c757d;
            color: white;
        }

        .btn:hover {
            opacity: 0.8;
        }

        .search-filter {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .search-filter input,
        .search-filter select {
            padding: 8px 12px;
            border: 2px solid #4A90E2;
            border-radius: 5px;
            font-size: 14px;
        }

        .search-filter button {
            padding: 8px 16px;
            background: #4A90E2;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
        }

        .modal-content {
            background-color: white;
            margin: 5% auto;
            padding: 30px;
            border-radius: 15px;
            width: 90%;
            max-width: 600px;
            max-height: 80vh;
            overflow-y: auto;
        }

        .modal-header {
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #4A90E2;
        }

        .modal-header h3 {
            color: #4A90E2;
            margin: 0;
        }

        .modal-footer {
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid #ddd;
            text-align: right;
        }

        .modal-footer button {
            margin-left: 10px;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-primary {
            background: #4A90E2;
            color: white;
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
        }

        @media (max-width: 768px) {
            .container {
                margin: 10px;
                padding: 15px;
            }

            .dashboard-grid {
                grid-template-columns: 1fr;
            }

            .tabs-header {
                flex-direction: column;
            }

            .search-filter {
                flex-direction: column;
            }

            .action-buttons {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="page-wrapper">
        <div class="container">
        <div class="header">
            <h1>⚙️ Admin Management</h1>
            <p>ระบบจัดการผู้ดูแลระบบ (Firebase)</p>
        </div>

        <div class="firebase-notice">
            <h3>🔥 เชื่อมต่อกับ Firebase</h3>
            <p>ระบบจัดการข้อมูลและการอนุมัติจาก Firebase Database แบบ Real-time</p>
        </div>

        <div id="loadingIndicator" class="loading">
            <div>🔄 กำลังเชื่อมต่อระบบ... <span id="loadingProgress">0/3</span></div>
        </div>

        <div id="mainContent" style="display: none;">
            <!-- Main Tabs Container - จัดการเครื่องมือ 3 สถานะ -->
            <div class="tabs-container">
                <div class="tabs-header" style="display: flex; gap: 0; background: #4A90E2; border-radius: 0;">
                    <button class="tab-button active" onclick="switchMainTab('pending')" data-tab="pending" style="flex: 1; padding: 15px 20px; background: white; color: #4A90E2; border: none; cursor: pointer; font-size: 18px; font-weight: bold; transition: all 0.3s;">

                    </button>
                    <button class="tab-button" onclick="switchMainTab('return')" data-tab="return" style="flex: 1; padding: 15px 20px; background: transparent; color: white; border: none; cursor: pointer; font-size: 18px; font-weight: bold; transition: all 0.3s;">
                        🔄 ส่งคืนเครื่องมือ
                    </button>
                    <button class="tab-button" onclick="switchMainTab('storage')" data-tab="storage" style="flex: 1; padding: 15px 20px; background: transparent; color: white; border: none; cursor: pointer; font-size: 18px; font-weight: bold; transition: all 0.3s;">
                        📦 จัดเก็บเครื่องมือ
                    </button>
                </div>

                <!-- Main Content Area -->
                <div class="tab-content active" style="padding: 25px;">
                    
                    <div class="search-filter">
                        <input type="text" id="requestSearch" placeholder="ค้นหาคำขอ...">

                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>วันที่ขอ</th>

                                    <th>หน่วยงาน</th>
                                    <th>เครื่องมือ</th>
                                    <th>สถานะ</th>
                                    <th>การดำเนินการ</th>
                                </tr>
                            </thead>
                            <tbody id="requestsTableBody">
                                <!-- ข้อมูลจะแสดงที่นี่ -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Request Detail Modal -->
    <div id="requestModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>รายละเอียดคำขอ</h3>
            </div>
            <div id="requestModalBody">
                <!-- รายละเอียดคำขอจะแสดงที่นี่ -->
            </div>
            <div class="modal-footer">
                <button class="btn-secondary" onclick="closeModal()">ปิด</button>
                <button class="btn-primary" onclick="updateRequestStatus()">อัพเดทสถานะ</button>
            </div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script type="module" src="firebase-emergency-config.js"></script>
    
    <script type="module">
        // ตัวแปรสำหรับเก็บข้อมูล
        let allRequests = [];
        let allEmployees = [];
        let allTools = [];
        let currentRequest = null;

        // รอให้ Firebase พร้อมใช้งาน
        document.addEventListener('DOMContentLoaded', function() {
            console.log('🔗 Navbar จะถูกสร้างโดย navbar.js อัตโนมัติ');
        });

        window.addEventListener('load', async () => {
            console.log('🚀 เริ่มต้นระบบ Admin Management');
            
            try {
                // อัพเดทความคืบหน้า
                document.getElementById('loadingProgress').textContent = '1/3';
                document.getElementById('loadingIndicator').innerHTML = '<div>🔄 กำลังเชื่อมต่อ Firebase... <span id="loadingProgress">1/3</span></div>';
                
                // รอให้ Firebase Service พร้อม (ด้วย timeout)
                await waitForFirebase();
                
                // อัพเดทความคืบหน้า
                document.getElementById('loadingProgress').textContent = '2/3';
                document.getElementById('loadingIndicator').innerHTML = '<div>🔄 กำลังโหลดข้อมูล... <span id="loadingProgress">2/3</span></div>';
                
                // โหลดข้อมูลจาก Firebase
                await loadAllData();
                
                // อัพเดทความคืบหน้า
                document.getElementById('loadingProgress').textContent = '3/3';
                document.getElementById('loadingIndicator').innerHTML = '<div>✅ โหลดข้อมูลเสร็จสิ้น <span id="loadingProgress">3/3</span></div>';
                
            } catch (error) {
                console.warn('⚠️ Firebase ไม่พร้อม - ใช้โหมดสำรอง:', error.message);
                
                // อัพเดทสถานะ
                document.getElementById('loadingIndicator').innerHTML = '<div>⚠️ เปลี่ยนเป็นโหมดสำรอง... <span id="loadingProgress">2/3</span></div>';
                
                // ใช้ข้อมูลตัวอย่าง
                allRequests = getSampleRequests();
                allEmployees = getSampleEmployees();
                allTools = getSampleTools();
                
                // อัพเดทความคืบหน้า
                document.getElementById('loadingIndicator').innerHTML = `
                    <div style="color: orange; text-align: center;">
                        ⚠️ ทำงานในโหมดสำรอง<br>
                        <small>Firebase ไม่พร้อม - แสดงข้อมูลตัวอย่าง</small>
                    </div>
                `;
                
                // รอ 1 วินาทีแล้วแสดงเนื้อหา
                setTimeout(() => {
                    document.getElementById('loadingIndicator').style.display = 'none';
                    document.getElementById('mainContent').style.display = 'block';
                    
                    displayRequests();
                    
                    console.log('✅ โหลดข้อมูลตัวอย่างเสร็จสิ้น');
                }, 1000);
            }
        });

        function waitForFirebase() {
            return new Promise((resolve, reject) => {
                let attempts = 0;
                const maxAttempts = 30; // รอสูงสุด 3 วินาที (30 x 100ms)
                
                const checkFirebase = () => {
                    attempts++;
                    console.log(`🔍 ตรวจสอบ Firebase... ครั้งที่ ${attempts}`);
                    
                    if (window.firebaseConfig || window.firebase) {
                        console.log('✅ Firebase พร้อมใช้งาน');
                        resolve();
                    } else if (attempts >= maxAttempts) {
                        console.warn('⚠️ Firebase ไม่พร้อมใช้งาน - ใช้โหมด Demo');
                        reject(new Error('Firebase timeout - 3 seconds'));
                    } else {
                        setTimeout(checkFirebase, 100);
                    }
                };
                checkFirebase();
            });
        }

        async function loadAllData() {
            try {
                document.getElementById('loadingIndicator').innerHTML = '<div>🔄 กำลังโหลดข้อมูลจาก Firebase... (รอสูงสุด 5 วินาที)</div>';
                
                // ตรวจสอบว่าใช้ระบบ emergency หรือ real config
                const firebaseService = window.firebaseConfig || window.firebase;
                
                if (!firebaseService) {
                    throw new Error('Firebase service not available');
                }
                
                // โหลดข้อมูลทั้งหมดพร้อมกันด้วย timeout 5 วินาที
                const loadPromise = Promise.all([
                    firebaseService.getToolRequests ? firebaseService.getToolRequests() : firebaseService.getRequests ? firebaseService.getRequests() : [],
                    firebaseService.getEmployees ? firebaseService.getEmployees() : [],
                    firebaseService.getTools ? firebaseService.getTools() : []
                ]);

                // เพิ่ม timeout 5 วินาที
                const timeoutPromise = new Promise((_, reject) => {
                    setTimeout(() => reject(new Error('Firebase loading timeout - 5 seconds')), 5000);
                });

                const [requests, employees, tools] = await Promise.race([loadPromise, timeoutPromise]);

                allRequests = requests || [];
                allEmployees = employees || [];
                allTools = tools || [];
                
                console.log('📋 คำขอ:', allRequests.length);
                console.log('👥 พนักงาน:', allEmployees.length);
                console.log('🔧 เครื่องมือ:', allTools.length);

                // ซ่อน loading และแสดงเนื้อหา
                document.getElementById('loadingIndicator').style.display = 'none';
                document.getElementById('mainContent').style.display = 'block';

                // แสดงข้อมูลทั้งหมด
                displayRequests();

                console.log('✅ โหลดข้อมูลเสร็จสิ้น');

            } catch (error) {
                console.error('❌ Error loading data:', error);
                console.warn('🔄 กำลังใช้ข้อมูลตัวอย่าง...');
                
                // ลองใช้ข้อมูลจาก cache ก่อน
                const cachedRequests = localStorage.getItem('admin_cached_requests');
                const cachedEmployees = localStorage.getItem('admin_cached_employees');
                const cachedTools = localStorage.getItem('admin_cached_tools');
                
                if (cachedRequests && cachedEmployees && cachedTools) {
                    console.log('💾 ใช้ข้อมูลจาก cache');
                    allRequests = JSON.parse(cachedRequests);
                    allEmployees = JSON.parse(cachedEmployees);
                    allTools = JSON.parse(cachedTools);
                } else {
                    // ใช้ข้อมูลตัวอย่างเมื่อไม่มี cache
                    console.log('📝 ใช้ข้อมูลตัวอย่าง');
                    allRequests = getSampleRequests();
                    allEmployees = getSampleEmployees();
                    allTools = getSampleTools();
                    
                    // บันทึกลง cache
                    localStorage.setItem('admin_cached_requests', JSON.stringify(allRequests));
                    localStorage.setItem('admin_cached_employees', JSON.stringify(allEmployees));
                    localStorage.setItem('admin_cached_tools', JSON.stringify(allTools));
                }
                
                document.getElementById('loadingIndicator').innerHTML = `
                    <div style="color: orange; text-align: center;">
                        ⚠️ เชื่อมต่อ Firebase ไม่ได้ - กำลังใช้ข้อมูลสำรอง<br>
                        <small>ระบบจะทำงานในโหมด Offline</small>
                    </div>
                `;
                
                // รอ 1 วินาทีแล้วแสดงเนื้อหา
                setTimeout(() => {
                    document.getElementById('loadingIndicator').style.display = 'none';
                    document.getElementById('mainContent').style.display = 'block';
                    
                    // แสดงข้อมูลตัวอย่าง
                    displayRequests();
                    
                    console.log('✅ โหลดข้อมูลสำรองเสร็จสิ้น');
                }, 1000);
            }
        }

        // ฟังก์ชันสำหรับข้อมูลตัวอย่าง (เมื่อ Firebase ไม่พร้อม)

        function getSampleTools() {
            return [
                {
                    id: 'E.MJ.CON.010.031.011.0005',

                },
                {

                    category: 'เครื่องมือวัด',
                    status: 'in_use',
                    location: 'โครงการ XYZ'
                },
                {
                    id: 'E.MJ.CON.015.045.002.0012',
                    name: 'สว่านไฟฟ้าแบบไร้สาย',
                    category: 'เครื่องมือไฟฟ้า',
                    status: 'maintenance',
                    location: 'ศูนย์ซ่อมบำรุง'
                },
                {
                    id: 'E.MJ.CON.008.025.003.0045',
                    name: 'เลื่อยวงเดือนไฟฟ้า',
                    category: 'เครื่องมือตัด',
                    status: 'damaged',
                    location: 'คลังหลัก'
                },
                {
                    id: 'E.MJ.CON.012.038.001.0067',
                    name: 'เครื่องเชื่อมไฟฟ้า TIG 200A',
                    category: 'เครื่องเชื่อม',
                    status: 'available',
                    location: 'คลังหลัก'
                }
            ];
        }

        // ฟังก์ชัน updateDashboardStats ถูกลบออกเพราะไม่ใช้แล้ว

        function displayRequests(searchText = '') {
            const tbody = document.getElementById('requestsTableBody');
            
            // กรองข้อมูลตาม sub-tab และคำค้นหา
            let filteredRequests = allRequests;
            
            // กรองตามคำค้นหา
            if (searchText) {
                filteredRequests = filteredRequests.filter(request => 
                    request.id.toLowerCase().includes(searchText) ||
                    (request.employee_name && request.employee_name.toLowerCase().includes(searchText)) ||
                    (request.employee_id && request.employee_id.toLowerCase().includes(searchText))
                );
            }
            
            // กรองตาม sub-tab
            if (currentRequestSubTab === 'pending') {
                // จัดการคำขอเบิก: แสดงคำขอที่รอดำเนินการ
                filteredRequests = filteredRequests.filter(r => r.status === 'pending' || r.status === 'approved');
            } else if (currentRequestSubTab === 'return') {
                // ส่งคืนเครื่องมือ: แสดงเครื่องมือที่กำลังใช้งาน (approved + delivered)
                filteredRequests = filteredRequests.filter(r => r.status === 'approved' || r.status === 'delivered');
            } else if (currentRequestSubTab === 'storage') {
                // จัดเก็บเครื่องมือ: แสดงเครื่องมือที่รับคืนแล้ว (maintenance status)
                filteredRequests = filteredRequests.filter(r => r.status === 'returned' || r.status === 'maintenance');
            }
            
            if (filteredRequests.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" style="text-align: center; padding: 20px; color: #999;">ไม่พบข้อมูล</td></tr>';
                return;
            }
            
            tbody.innerHTML = filteredRequests.map(request => `
                <tr>
                    <td>${request.id}</td>
                    <td>${formatDate(request.created_at)}</td>
                    <td>${request.employee_name}<br><small>${request.employee_id}</small></td>
                    <td>${request.department || '-'}<br><small>${request.section || '-'}</small></td>
                    <td>
                        ${request.requested_tools ? request.requested_tools.length : 0} รายการ
                        <br><small>${request.requested_tools ? request.requested_tools.map(t => t.tool_name).slice(0,2).join(', ') : ''}</small>
                    </td>
                    <td><span class="status-badge status-${request.status}">${getStatusText(request.status)}</span></td>
                    <td>
                        ${getRequestActionButtons(request)}
                    </td>
                </tr>
            `).join('');
        }
        
        // ฟังก์ชันสร้างปุ่มการจัดการตาม sub-tab
        function getRequestActionButtons(request) {
            const buttons = [];
            
            // ปุ่มดู (แสดงทุก sub-tab)
            buttons.push(`<button class="btn btn-view" onclick="viewRequest('${request.id}')" style="background: #17a2b8; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; margin: 2px;">👁️ ดู</button>`);
            
            // ปุ่มตาม sub-tab ปัจจุบัน
            switch(currentRequestSubTab) {
                case 'pending':
                    // แท็บจัดการคำขอ: แสดงปุ่มอนุมัติ/ปฏิเสธ
                    if (request.status === 'pending') {
                        buttons.push(`
                            <button class="btn btn-approve" onclick="approveRequest('${request.id}')" style="background: #28a745; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; margin: 2px;">✅ อนุมัติ</button>
                            <button class="btn btn-reject" onclick="rejectRequest('${request.id}')" style="background: #dc3545; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; margin: 2px;">❌ ปฏิเสธ</button>
                        `);
                    }
                    break;
                
                case 'return':
                    // แท็บส่งคืน: แสดงปุ่มรับคืน
                    if (request.status === 'approved' || request.status === 'delivered') {
                        buttons.push(`
                            <button class="btn btn-return" onclick="returnToolRequest('${request.id}')" style="background: #28a745; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; margin: 2px;">🔄 รับคืน</button>
                        `);
                    }
                    break;
                
                case 'storage':
                    // แท็บจัดเก็บ: แสดงปุ่มจัดเก็บ (เปลี่ยนเป็น available)
                    if (request.status === 'returned' || request.status === 'maintenance') {
                        buttons.push(`
                            <button class="btn btn-storage" onclick="storeToolRequest('${request.id}')" style="background: #007bff; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; margin: 2px;">✅ เสร็จแล้ว</button>
                        `);
                    }
                    break;
            }
            
            return `<div class="action-buttons" style="display: flex; gap: 5px; flex-wrap: wrap;">${buttons.join('')}</div>`;
        }

        // ฟังก์ชันต่างๆ
        function formatDate(dateString) {
            if (!dateString) return 'ไม่ระบุ';
            
            try {
                let date;
                if (dateString.toDate) {
                    date = dateString.toDate();
                } else {
                    date = new Date(dateString);
                }
                
                return date.toLocaleDateString('th-TH', {
                    year: 'numeric',
                    month: 'short',
                    day: 'numeric'
                });
            } catch (error) {
                return dateString;
            }
        }

        function getStatusText(status) {
            const statusTexts = {
                'pending': 'รอดำเนินการ',
                'approved': 'อนุมัติแล้ว',
                'delivered': 'ส่งมอบแล้ว',
                'returned': 'รับคืนแล้ว',
                'maintenance': 'กำลังตรวจสอบ/ซ่อม',
                'completed': 'เสร็จสิ้น',
                'rejected': 'ปฏิเสธ'
            };
            return statusTexts[status] || 'ไม่ระบุ';
        }

        function getToolStatusText(status) {
            const statusTexts = {
                'available': 'พร้อมใช้งาน',
                'in_use': 'กำลังใช้งาน',
                'maintenance': 'ซ่อมบำรุง',
                'damaged': 'ชำรุด'
            };
            return statusTexts[status] || 'พร้อมใช้งาน';
        }

        // ฟังก์ชันสำหรับ Main Tabs (จัดการเครื่องมือ 3 สถานะ)
        let currentMainTab = 'pending';
        
        window.switchMainTab = function(tabName) {
            console.log('🔄 สลับไปยัง tab:', tabName);
            currentMainTab = tabName;
            
            // อัพเดท UI ของปุ่ม
            document.querySelectorAll('.tab-button').forEach(btn => {
                if (btn.dataset.tab === tabName) {
                    btn.classList.add('active');
                    btn.style.background = 'white';
                    btn.style.color = '#4A90E2';
                } else {
                    btn.classList.remove('active');
                    btn.style.background = 'transparent';
                    btn.style.color = 'white';
                }
            });
            
            // เรียกใช้ฟังก์ชัน sub-tab เดิม
            switchRequestSubTab(tabName);
        };

        // ฟังก์ชันจัดการคำขอ
        window.viewRequest = function(requestId) {
            const request = allRequests.find(req => req.id === requestId);
            if (!request) return;

            currentRequest = request;
            
            document.getElementById('requestModalBody').innerHTML = `
                <div style="margin-bottom: 15px;">
                    <strong>รหัสคำขอ:</strong> ${request.id}<br>
                    <strong>วันที่ขอ:</strong> ${formatDate(request.created_at)}<br>
                    <strong>ผู้ขอ:</strong> ${request.employee_name} (${request.employee_id})<br>
                    <strong>หน่วยงาน:</strong> ${request.department || '-'}<br>
                    <strong>แผนก:</strong> ${request.section || '-'}<br>
                    <strong>โครงการ:</strong> ${request.project || '-'}
                </div>
                
                <div style="margin-bottom: 15px;">
                    <strong>รายการเครื่องมือ:</strong>
                    ${request.requested_tools ? request.requested_tools.map(tool => `
                        <div style="padding: 8px; border: 1px solid #ddd; margin: 5px 0; border-radius: 5px;">
                            <strong>${tool.tool_name}</strong><br>
                            รหัส: ${tool.tool_code || '-'} | จำนวน: ${tool.quantity}<br>
                            ${tool.note ? `หมายเหตุ: ${tool.note}` : ''}
                        </div>
                    `).join('') : 'ไม่มีรายการเครื่องมือ'}
                </div>
                
                <div>
                    <strong>สถานะปัจจุบัน:</strong> 
                    <span class="status-badge status-${request.status}">${getStatusText(request.status)}</span>
                </div>
            `;
            
            document.getElementById('requestModal').style.display = 'block';
        };

        window.approveRequest = async function(requestId) {
            if (confirm('ยืนยันการอนุมัติคำขอนี้?')) {
                try {
                    await window.firebase.updateRequestStatus(requestId, 'approved', 'Admin');
                    alert('อนุมัติคำขอเรียบร้อยแล้ว');
                    await loadAllData(); // โหลดข้อมูลใหม่
                } catch (error) {
                    alert('เกิดข้อผิดพลาด: ' + error.message);
                }
            }
        };

        window.rejectRequest = async function(requestId) {
            const reason = prompt('กรุณาระบุเหตุผลในการปฏิเสธ:');
            if (reason) {
                try {
                    await window.firebase.updateRequestStatus(requestId, 'rejected', 'Admin');
                    alert('ปฏิเสธคำขอเรียบร้อยแล้ว');
                    await loadAllData(); // โหลดข้อมูลใหม่
                } catch (error) {
                    alert('เกิดข้อผิดพลาด: ' + error.message);
                }
            }
        };

        window.completeRequest = async function(requestId) {
            if (confirm('ยืนยันการทำเครื่องหมายเป็น "เสร็จสิ้น"?')) {
                try {
                    await window.firebase.updateRequestStatus(requestId, 'completed', 'Admin');
                    alert('อัพเดทสถานะเป็น "เสร็จสิ้น" เรียบร้อยแล้ว');
                    await loadAllData(); // โหลดข้อมูลใหม่
                } catch (error) {
                    alert('เกิดข้อผิดพลาด: ' + error.message);
                }
            }
        };

        // ฟังก์ชันรับคืนเครื่องมือ
        window.returnToolRequest = async function(requestId) {
            if (confirm('ยืนยันการรับคืนเครื่องมือ?\n\nสถานะจะเปลี่ยนเป็น "กำลังตรวจสอบ/ซ่อม" (maintenance)')) {
                try {
                    await window.firebase.updateRequestStatus(requestId, 'returned', 'Admin');
                    
                    // อัพเดทสถานะเครื่องมือในคำขอเป็น maintenance
                    const request = allRequests.find(r => r.id === requestId);
                    if (request && request.requested_tools) {
                        for (const tool of request.requested_tools) {
                            if (tool.tool_id) {
                                await window.firebase.updateToolStatus(tool.tool_id, 'maintenance');
                            }
                        }
                    }
                    
                    alert('✅ รับคืนเครื่องมือเรียบร้อย\nสถานะเปลี่ยนเป็น "กำลังตรวจสอบ/ซ่อม"');
                    await loadAllData();
                } catch (error) {
                    console.error('Error returning tools:', error);
                    alert('เกิดข้อผิดพลาด: ' + error.message);
                }
            }
        };

        // ฟังก์ชันจัดเก็บเครื่องมือ (เปลี่ยนเป็น available)
        window.storeToolRequest = async function(requestId) {
            if (confirm('ยืนยันการจัดเก็บเครื่องมือ?\n\nสถานะจะเปลี่ยนเป็น "พร้อมใช้งาน" (available)')) {
                try {
                    await window.firebase.updateRequestStatus(requestId, 'completed', 'Admin');
                    
                    // อัพเดทสถานะเครื่องมือในคำขอเป็น available
                    const request = allRequests.find(r => r.id === requestId);
                    if (request && request.requested_tools) {
                        for (const tool of request.requested_tools) {
                            if (tool.tool_id) {
                                await window.firebase.updateToolStatus(tool.tool_id, 'available');
                            }
                        }
                    }
                    
                    alert('✅ จัดเก็บเครื่องมือเรียบร้อย\nสถานะเปลี่ยนเป็น "พร้อมใช้งาน"');
                    await loadAllData();
                } catch (error) {
                    console.error('Error storing tools:', error);
                    alert('เกิดข้อผิดพลาด: ' + error.message);
                }
            }
        };

        window.closeModal = function() {
            document.getElementById('requestModal').style.display = 'none';
            currentRequest = null;
        };

        // ตัวแปรสำหรับติดตาม sub-tab ปัจจุบัน
        let currentRequestSubTab = 'pending';

        // ฟังก์ชันสลับ sub-tab
        window.switchRequestSubTab = function(subTab) {
            console.log('🔄 สลับไปยัง sub-tab:', subTab);
            currentRequestSubTab = subTab;
            
            // อัพเดท UI ของปุ่ม
            document.querySelectorAll('.sub-tab-btn').forEach(btn => {
                if (btn.dataset.subtab === subTab) {
                    btn.classList.add('active');
                    btn.style.background = '#4a7ba7';
                    btn.style.color = 'white';
                } else {
                    btn.classList.remove('active');
                    btn.style.background = '#f5f5f0';
                    btn.style.color = '#333';
                }
            });
            
            // แสดงข้อมูลตาม sub-tab
            displayRequests();
        };

        // ฟังก์ชันกรองข้อมูล
        window.filterRequests = function() {
            const searchText = document.getElementById('requestSearch').value.toLowerCase();
            displayRequests(searchText);
        };

        // Real-time listener สำหรับข้อมูลใหม่
        if (window.firebase) {
            window.firebase.listenToCollection('tool_requests', (newData) => {
                allRequests = newData;
                displayRequests();
            });
        }

    </script>
    </div>
</body>
</html>
